<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AISTEC 知识图谱可视化</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0a0e27;
            color: #fff;
            overflow: hidden;
        }
        #graph { width: 100vw; height: 100vh; }
        .node {
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .node:hover { filter: brightness(1.3); }
        .node-circle {
            stroke-width: 2px;
            stroke: rgba(255,255,255,0.3);
        }
        .node-label {
            font-size: 11px;
            fill: #fff;
            text-anchor: middle;
            pointer-events: none;
            text-shadow: 0 1px 3px rgba(0,0,0,0.8);
        }
        .link {
            stroke-opacity: 0.4;
            stroke-width: 1.5px;
        }
        .link.highlighted {
            stroke-opacity: 1;
            stroke-width: 3px;
        }
        #info-panel {
            position: fixed;
            top: 20px;
            right: 20px;
            width: 320px;
            background: rgba(16, 20, 40, 0.95);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            padding: 20px;
            backdrop-filter: blur(10px);
            display: none;
            max-height: 80vh;
            overflow-y: auto;
        }
        #info-panel h2 {
            font-size: 18px;
            margin-bottom: 10px;
            color: #64b5f6;
        }
        #info-panel .field {
            margin: 8px 0;
            font-size: 13px;
        }
        #info-panel .field-label {
            color: #8892b0;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        #info-panel .field-value {
            color: #ccd6f6;
            margin-top: 2px;
        }
        #controls {
            position: fixed;
            top: 20px;
            left: 20px;
            background: rgba(16, 20, 40, 0.95);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            padding: 15px;
            backdrop-filter: blur(10px);
        }
        #controls h3 {
            font-size: 14px;
            margin-bottom: 10px;
            color: #64b5f6;
        }
        .legend-item {
            display: flex;
            align-items: center;
            margin: 5px 0;
            font-size: 12px;
        }
        .legend-color {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            margin-right: 8px;
        }
        #search-box {
            position: fixed;
            bottom: 20px;
            left: 20px;
            background: rgba(16, 20, 40, 0.95);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 8px;
            padding: 10px 15px;
            display: flex;
            gap: 10px;
        }
        #search-input {
            background: transparent;
            border: none;
            color: #fff;
            outline: none;
            width: 200px;
        }
        #search-input::placeholder { color: #8892b0; }
    </style>
</head>
<body>
    <div id="graph"></div>
    
    <div id="controls">
        <h3>学科分类</h3>
        <div class="legend-item">
            <div class="legend-color" style="background: #4caf50;"></div>
            <span>小学科学</span>
        </div>
        <div class="legend-item">
            <div class="legend-color" style="background: #2196f3;"></div>
            <span>初中物理</span>
        </div>
        <div class="legend-item">
            <div class="legend-color" style="background: #ff9800;"></div>
            <span>初中化学</span>
        </div>
        <div class="legend-item">
            <div class="legend-color" style="background: #e91e63;"></div>
            <span>初中生物</span>
        </div>
    </div>
    
    <div id="info-panel">
        <h2 id="info-title">概念详情</h2>
        <div class="field">
            <div class="field-label">ID</div>
            <div class="field-value" id="info-id"></div>
        </div>
        <div class="field">
            <div class="field-label">学科</div>
            <div class="field-value" id="info-subject"></div>
        </div>
        <div class="field">
            <div class="field-label">年级</div>
            <div class="field-value" id="info-grade"></div>
        </div>
        <div class="field">
            <div class="field-label">前置知识</div>
            <div class="field-value" id="info-prereq"></div>
        </div>
        <div class="field">
            <div class="field-label">常见误解</div>
            <div class="field-value" id="info-misconceptions"></div>
        </div>
    </div>
    
    <div id="search-box">
        <input type="text" id="search-input" placeholder="搜索知识点...">
    </div>

    <script>
        // 知识图谱数据
        const graphData = {
            nodes: [
                // 小学科学
                { id: "SCI-MOT-001", name: "运动与力", subject: "小学科学", grade: "小学四年级", group: 1 },
                { id: "SCI-MAT-001", name: "物体的特征", subject: "小学科学", grade: "小学一年级", group: 1 },
                { id: "SCI-MAT-004", name: "物体的运动", subject: "小学科学", grade: "小学四年级", group: 1 },
                { id: "SCI-FORCE-001", name: "声音的产生", subject: "小学科学", grade: "小学四年级", group: 1 },
                { id: "SCI-HEAT-001", name: "热与物态", subject: "小学科学", grade: "小学三年级", group: 1 },
                { id: "SCI-LIGHT-001", name: "光的传播", subject: "小学科学", grade: "小学五年级", group: 1 },
                { id: "SCI-MAG-001", name: "磁铁", subject: "小学科学", grade: "小学二年级", group: 1 },
                
                // 初中物理 - 八年级上
                { id: "PHYS-MOTION-001", name: "机械运动", subject: "物理", grade: "初中八年级上", group: 2 },
                { id: "PHYS-MOTION-002", name: "速度", subject: "物理", grade: "初中八年级上", group: 2 },
                { id: "PHYS-SOUND-001", name: "声音的传播", subject: "物理", grade: "初中八年级上", group: 2 },
                { id: "PHYS-THERMO-001", name: "温度与物态", subject: "物理", grade: "初中八年级上", group: 2 },
                { id: "PHYS-OPTICS-001", name: "光的直线传播", subject: "物理", grade: "初中八年级上", group: 2 },
                { id: "PHYS-OPTICS-002", name: "光的反射", subject: "物理", grade: "初中八年级上", group: 2 },
                { id: "PHYS-OPTICS-004", name: "光的折射", subject: "物理", grade: "初中八年级上", group: 2 },
                { id: "PHYS-MATTER-001", name: "质量", subject: "物理", grade: "初中八年级上", group: 2 },
                { id: "PHYS-MATTER-002", name: "密度", subject: "物理", grade: "初中八年级上", group: 2 },
                
                // 初中物理 - 八年级下（力学核心）
                { id: "PHYS-FORCE-001", name: "力的概念", subject: "物理", grade: "初中八年级下", group: 2, isCore: true },
                { id: "PHYS-FORCE-002", name: "重力", subject: "物理", grade: "初中八年级下", group: 2 },
                { id: "PHYS-FORCE-003", name: "弹力", subject: "物理", grade: "初中八年级下", group: 2 },
                { id: "PHYS-FORCE-004", name: "摩擦力", subject: "物理", grade: "初中八年级下", group: 2 },
                { id: "PHYS-NEWTON-001", name: "牛顿第一定律", subject: "物理", grade: "初中八年级下", group: 2, isCore: true },
                { id: "PHYS-NEWTON-002", name: "二力平衡", subject: "物理", grade: "初中八年级下", group: 2 },
                { id: "PHYS-PRESSURE-001", name: "压强", subject: "物理", grade: "初中八年级下", group: 2 },
                { id: "PHYS-BUOY-001", name: "浮力", subject: "物理", grade: "初中八年级下", group: 2 },
                { id: "PHYS-WORK-001", name: "功", subject: "物理", grade: "初中八年级下", group: 2 },
                { id: "PHYS-ENERGY-001", name: "动能和势能", subject: "物理", grade: "初中八年级下", group: 2 },
                { id: "PHYS-SIMPLE-001", name: "杠杆", subject: "物理", grade: "初中八年级下", group: 2 },
                
                // 初中化学
                { id: "CHEM-MAT-001", name: "物质的构成", subject: "化学", grade: "初中九年级", group: 3 },
                { id: "CHEM-MAT-002", name: "元素", subject: "化学", grade: "初中九年级", group: 3 },
                { id: "CHEM-REACT-001", name: "化学变化", subject: "化学", grade: "初中九年级", group: 3 },
                
                // 初中生物
                { id: "BIO-CELL-001", name: "细胞", subject: "生物", grade: "初中七年级", group: 4 },
                { id: "BIO-PLANT-001", name: "光合作用", subject: "生物", grade: "初中七年级", group: 4 },
            ],
            links: [
                // 小学到初中衔接
                { source: "SCI-MAT-004", target: "SCI-MOT-001" },
                { source: "SCI-MOT-001", target: "PHYS-FORCE-001" },
                { source: "SCI-MAT-001", target: "PHYS-MATTER-001" },
                { source: "SCI-LIGHT-001", target: "PHYS-OPTICS-001" },
                { source: "SCI-FORCE-001", target: "PHYS-SOUND-001" },
                { source: "SCI-HEAT-001", target: "PHYS-THERMO-001" },
                { source: "SCI-MAG-001", target: "PHYS-ELEC-001" },
                
                // 八年级上内部
                { source: "PHYS-MOTION-001", target: "PHYS-MOTION-002" },
                { source: "PHYS-MATTER-001", target: "PHYS-MATTER-002" },
                { source: "PHYS-OPTICS-001", target: "PHYS-OPTICS-002" },
                { source: "PHYS-OPTICS-001", target: "PHYS-OPTICS-004" },
                
                // 八年级下力学核心
                { source: "PHYS-MATTER-001", target: "PHYS-FORCE-001" },
                { source: "PHYS-FORCE-001", target: "PHYS-FORCE-002" },
                { source: "PHYS-FORCE-001", target: "PHYS-FORCE-003" },
                { source: "PHYS-FORCE-001", target: "PHYS-FORCE-004" },
                { source: "PHYS-FORCE-001", target: "PHYS-NEWTON-002" },
                { source: "PHYS-FORCE-001", target: "PHYS-PRESSURE-001" },
                { source: "PHYS-FORCE-001", target: "PHYS-SIMPLE-001" },
                { source: "PHYS-FORCE-004", target: "PHYS-NEWTON-001" },
                { source: "PHYS-FORCE-001", target: "PHYS-NEWTON-001" },
                { source: "PHYS-PRESSURE-001", target: "PHYS-BUOY-001" },
                { source: "PHYS-MOTION-002", target: "PHYS-WORK-001" },
                { source: "PHYS-WORK-001", target: "PHYS-ENERGY-001" },
                
                // 化学
                { source: "SCI-MAT-001", target: "CHEM-MAT-001" },
                { source: "CHEM-MAT-001", target: "CHEM-MAT-002" },
                { source: "SCI-HEAT-001", target: "CHEM-REACT-001" },
                
                // 生物
                { source: "SCI-LIFE-001", target: "BIO-CELL-001" },
                { source: "BIO-CELL-001", target: "BIO-PLANT-001" },
            ]
        };

        // 颜色映射
        const colorMap = {
            1: '#4caf50',  // 小学科学
            2: '#2196f3',  // 初中物理
            3: '#ff9800',  // 初中化学
            4: '#e91e63'   // 初中生物
        };

        // 设置画布
        const width = window.innerWidth;
        const height = window.innerHeight;
        
        const svg = d3.select("#graph")
            .append("svg")
            .attr("width", width)
            .attr("height", height);
        
        // 添加缩放行为
        const g = svg.append("g");
        
        svg.call(d3.zoom()
            .extent([[0, 0], [width, height]])
            .scaleExtent([0.1, 4])
            .on("zoom", ({transform}) => {
                g.attr("transform", transform);
            }));
        
        // 力导向模拟
        const simulation = d3.forceSimulation(graphData.nodes)
            .force("link", d3.forceLink(graphData.links).id(d => d.id).distance(100))
            .force("charge", d3.forceManyBody().strength(-300))
            .force("center", d3.forceCenter(width / 2, height / 2))
            .force("collision", d3.forceCollide().radius(40));
        
        // 绘制连线
        const link = g.append("g")
            .selectAll("line")
            .data(graphData.links)
            .join("line")
            .attr("class", "link")
            .attr("stroke", "#64b5f6");
        
        // 绘制节点组
        const node = g.append("g")
            .selectAll("g")
            .data(graphData.nodes)
            .join("g")
            .attr("class", "node")
            .call(d3.drag()
                .on("start", dragstarted)
                .on("drag", dragged)
                .on("end", dragended));
        
        // 节点圆圈
        node.append("circle")
            .attr("class", "node-circle")
            .attr("r", d => d.isCore ? 25 : 18)
            .attr("fill", d => colorMap[d.group])
            .attr("stroke", d => d.isCore ? "#ff5252" : "rgba(255,255,255,0.3)")
            .attr("stroke-width", d => d.isCore ? 3 : 2);
        
        // 节点标签
        node.append("text")
            .attr("class", "node-label")
            .attr("dy", d => d.isCore ? 35 : 28)
            .text(d => d.name);
        
        // 点击事件
        node.on("click", (event, d) => {
            showInfo(d);
            highlightPath(d);
        });
        
        // 模拟更新位置
        simulation.on("tick", () => {
            link
                .attr("x1", d => d.source.x)
                .attr("y1", d => d.source.y)
                .attr("x2", d => d.target.x)
                .attr("y2", d => d.target.y);
            
            node.attr("transform", d => `translate(${d.x},${d.y})`);
        });
        
        // 拖拽函数
        function dragstarted(event, d) {
            if (!event.active) simulation.alphaTarget(0.3).restart();
            d.fx = d.x;
            d.fy = d.y;
        }
        
        function dragged(event, d) {
            d.fx = event.x;
            d.fy = event.y;
        }
        
        function dragended(event, d) {
            if (!event.active) simulation.alphaTarget(0);
            d.fx = null;
            d.fy = null;
        }
        
        // 显示信息面板
        function showInfo(d) {
            document.getElementById('info-panel').style.display = 'block';
            document.getElementById('info-title').textContent = d.name;
            document.getElementById('info-id').textContent = d.id;
            document.getElementById('info-subject').textContent = d.subject;
            document.getElementById('info-grade').textContent = d.grade;
            
            // 查找前置知识
            const prereqs = graphData.links
                .filter(l => l.target.id === d.id)
                .map(l => l.source.name);
            document.getElementById('info-prereq').textContent = 
                prereqs.length > 0 ? prereqs.join('、') : '无';
            
            document.getElementById('info-misconceptions').textContent = 
                '点击查看详情...';
        }
        
        // 高亮路径
        function highlightPath(selectedNode) {
            // 重置所有连线
            link.classed('highlighted', false);
            
            // 查找与选中节点相关的连线
            const connectedLinks = graphData.links.filter(
                l => l.source.id === selectedNode.id || l.target.id === selectedNode.id
            );
            
            link.filter(d => connectedLinks.includes(d))
                .classed('highlighted', true);
        }
        
        // 搜索功能
        document.getElementById('search-input').addEventListener('input', (e) => {
            const term = e.target.value.toLowerCase();
            if (!term) {
                node.style('opacity', 1);
                link.style('opacity', 1);
                return;
            }
            
            const matched = graphData.nodes.filter(n => 
                n.name.toLowerCase().includes(term) || 
                n.id.toLowerCase().includes(term)
            );
            
            node.style('opacity', d => matched.includes(d) ? 1 : 0.1);
            link.style('opacity', 0.05);
        });
        
        // 点击空白处关闭面板
        svg.on("click", (event) => {
            if (event.target.tagName === 'svg') {
                document.getElementById('info-panel').style.display = 'none';
                link.classed('highlighted', false);
            }
        });
    </script>
</body>
</html>
