id: SCI-LIFE-001
name: 生物体具有一定的结构层次
name_en: Organisms Have Hierarchical Structures
subject: 小学科学
domain: 生命科学
grade: 小学一至三年级

description: |
  知道生物体具有一定的结构层次，从微观到宏观依次为：细胞→组织→器官→系统→个体。
  了解细胞是生物体结构和功能的基本单位。
  认识植物体的基本结构：根、茎、叶、花、果实、种子。
  认识动物体的基本结构：头、颈、躯干、四肢等。
  知道不同生物体的结构与其功能相适应。
  能使用放大镜、显微镜等简单工具观察生物体的结构。
  了解生物体结构的多样性。

prerequisites: []

postrequisites:
  - id: SCI-LIFE-004
    name: 动物和植物都有基本生存需要
  - id: SCI-BODY-001
    name: 人体由多个系统组成

key_concepts:
  - term: 细胞
    definition: 生物体结构和功能的基本单位
    importance: 核心
  - term: 组织
    definition: 形态相似、功能相同的细胞群
    importance: 重要
  - term: 器官
    definition: 由不同组织构成，能完成特定功能的结构
    importance: 重要
  - term: 植物的器官
    definition: 根、茎、叶（营养器官）；花、果实、种子（生殖器官）
    importance: 核心
  - term: 结构与功能
    definition: 生物体的结构与其功能相适应
    importance: 核心

misconceptions:
  - statement: "所有生物都是由细胞组成的"
    correction: "除病毒外，所有生物都是由细胞组成的"
    source: 义务教育科学课程标准（2022年版）
  - statement: "植物没有器官"
    correction: "植物有根、茎、叶、花、果实、种子六大器官"
    source: 义务教育科学课程标准（2022年版）

cognitive_level:
  min_age: 7
  piaget_stage: 具体运算阶段
  prerequisite_reasoning: 观察与比较

activity_suggestions:
  - framework: 5E
    brief: Engage观察各种生物体→Explore用放大镜观察植物和动物的结构→Explain交流观察结果→Elaborate归纳生物体的结构层次
  - framework: 观察活动
    brief: 观察洋葱表皮细胞、叶片结构等

verification:
  status: verified
  sources:
    - "义务教育科学课程标准（2022年版）"
  last_verified: '2026-09-13'

interdisciplinary:
