    concept: 色彩与光影
    relation: 知识衔接
  - subject: 地理
    concept: 大气光学现象
    relation: 应用实例

exhibits:
  - venue: 中国科技馆
    name: 光学展厅
    relation: 展示光的传播、反射、折射现象
