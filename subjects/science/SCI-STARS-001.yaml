id: SCI-STARS-001
name: 星座与星系
name_en: Constellations and Galaxies
subject: 小学科学
domain: 地球与宇宙科学
grade: 小学五至六年级

description: |
  知道太阳是一颗恒星，能自己发光发热。
  了解恒星与行星的区别：恒星能自己发光，行星不能自己发光。
  认识星座：人们把天空中位置相近的恒星联系起来，想象成各种形状，称为星座。
  了解北斗七星和北极星，知道它们可以帮助辨别方向。
  知道银河系是由大量恒星、星云等组成的巨大天体系统，太阳是银河系中的一颗恒星。
  了解宇宙中有无数个像银河系一样的星系。
  了解人类探索宇宙的历程和成就，激发探索宇宙的兴趣。

prerequisites:
  - id: SCI-EARTH-001
    name: 在太阳系中，地球、月球和其他星球有规律地运动着
    required: false

postrequisites: []

key_concepts:
  - term: 恒星
    definition: 能自己发光发热的天体，如太阳
    importance: 核心
  - term: 行星
    definition: 围绕恒星运行、不能自己发光的天体，如地球
    importance: 核心
  - term: 星座
    definition: 天空中位置相近的恒星组成的图案
    importance: 核心
  - term: 北斗七星
    definition: 大熊星座中的七颗亮星，形状像勺子
    importance: 重要
  - term: 北极星
    definition: 位于北方天空的一颗亮星，几乎正对地球北极
    importance: 重要
  - term: 银河系
    definition: 由大量恒星、星云等组成的巨大天体系统
    importance: 核心

misconceptions:
  - statement: "星座中的星星真的连在一起"
    correction: "星座中的星星看起来近，实际上距离很远，只是从地球上看在同一方向"
    source: 义务教育科学课程标准（2022年版）
  - statement: "太阳是宇宙中最大的恒星"
    correction: "太阳只是银河系中一颗普通的恒星，比太阳大的恒星有很多"
    source: 义务教育科学课程标准（2022年版）

cognitive_level:
  min_age: 11
  piaget_stage: 形式运算阶段
  prerequisite_reasoning: 空间想象

activity_suggestions:
