id: SCI-EARTH-001
name: 在太阳系中，地球、月球和其他星球有规律地运动着
name_en: In the Solar System, Earth, Moon, and Other Celestial Bodies Move Regularly
subject: 小学科学
domain: 地球与宇宙科学
grade: 小学六年级

description: |
  知道太阳是太阳系的中心，太阳系中有八大行星及其卫星、小行星、彗星等天体。
  了解地球是太阳系中的一颗行星，月球是地球的卫星。
  知道地球自转产生昼夜交替，地球公转产生四季变化和昼夜长短变化。
  了解月相变化的原因：月球绕地球公转，太阳照射月球的角度不同。
  知道日食和月食的成因。
  了解人类探索太空的历程和成就，激发探索宇宙的兴趣。

prerequisites:
  - id: SCI-MOON-001
    name: 月相变化
    required: false

postrequisites:
  - id: GEO-EARTH-001
    name: 地球在宇宙中

key_concepts:
  - term: 太阳系
    definition: 以太阳为中心，由行星、卫星、小行星、彗星等天体组成的天体系统
    importance: 核心
  - term: 地球自转
    definition: 地球绕地轴自西向东旋转，周期约为24小时
    importance: 核心
  - term: 地球公转
    definition: 地球绕太阳自西向东运行，周期约为365天
    importance: 核心
  - term: 昼夜交替
    definition: 地球自转导致地球表面不同地区交替面对太阳和背对太阳
    importance: 核心
  - term: 四季变化
    definition: 地球公转时地轴倾斜导致太阳直射点在南北回归线之间移动
    importance: 核心
  - term: 月相
    definition: 月球被太阳照亮的部分在地球上看到的变化
    importance: 重要

misconceptions:
  - statement: "太阳绕着地球转"
    correction: "地球和其他行星绕着太阳公转，月球绕着地球公转"
    source: 义务教育科学课程标准（2022年版）
  - statement: "四季变化是因为地球离太阳远近不同"
    correction: "四季变化是因为地球公转时地轴倾斜，导致太阳直射角度不同"
    source: 义务教育科学课程标准（2022年版）

cognitive_level:
  min_age: 11
  piaget_stage: 形式运算阶段
  prerequisite_reasoning: 空间想象

activity_suggestions:
  - framework: 5E
    brief: Engage观察日月星辰的运动→Explore模拟地球自转和公转→Explain解释昼夜和四季的成因→Elaborate分析月相变化规律
  - framework: 模型建构
    brief: 制作三球仪模型，演示日食、月食的形成

verification:
  status: verified
  sources:
    - "义务教育科学课程标准（2022年版）"
  last_verified: '2026-09-13'

interdisciplinary:
