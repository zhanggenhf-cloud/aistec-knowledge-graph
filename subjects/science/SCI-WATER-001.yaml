id: SCI-WATER-001
name: 水在自然界的循环
name_en: Water Cycle in Nature
subject: 小学科学
domain: 地球与宇宙科学
grade: 小学三至五年级

description: |
  知道水在自然界以固态（冰）、液态（水）、气态（水蒸气）三种状态存在。
  了解水在自然界中的循环过程：蒸发→凝结→降水→径流→蒸发。
  知道水循环的动力主要来自太阳辐射。
  了解水循环对地球生命和气候的重要意义。
  知道地球上的水分布不均匀，淡水资源有限，要节约用水。
  了解影响水循环的因素：温度、地形、植被等。

prerequisites:
  - id: SCI-HEAT-001
    name: 热可以改变物质的状态
    required: false

postrequisites:
  - id: GEO-EARTH-003
    name: 天气与气候

key_concepts:
  - term: 蒸发
    definition: 水从液态变成气态进入大气的过程
    importance: 核心
  - term: 凝结
    definition: 水蒸气从气态变成液态（或固态）的过程
    importance: 核心
  - term: 降水
    definition: 大气中的水汽凝结后以雨、雪、冰雹等形式降落到地面
    importance: 核心
  - term: 径流
    definition: 降水沿地面或地下流动汇入河流、湖泊、海洋的过程
    importance: 核心
  - term: 水循环
    definition: 水在地球上的海洋、大气和陆地之间不断运动转化的过程
    importance: 核心

misconceptions:
  - statement: "水消失后就没了"
    correction: "水不会消失，只是从一种状态变成另一种状态或从一个地方移动到另一个地方"
    source: 义务教育科学课程标准（2022年版）
  - statement: "地球上的水取之不尽"
    correction: "地球上淡水资源有限，需要节约用水"
    source: 义务教育科学课程标准（2022年版）

cognitive_level:
  min_age: 9
  piaget_stage: 具体运算阶段
  prerequisite_reasoning: 系统思维

activity_suggestions:
  - framework: 5E
    brief: Engage观察云、雨、雪等天气现象→Explore模拟水循环实验→Explain解释水循环过程→Elaborate讨论水循环对生活的影响
  - framework: 模型建构
    brief: 绘制水循环示意图，标注各环节

verification:
