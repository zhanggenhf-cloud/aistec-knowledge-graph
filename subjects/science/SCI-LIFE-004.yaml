id: SCI-LIFE-004
name: 动物和植物都有基本生存需要
name_en: Animals and Plants Have Basic Survival Needs
subject: 小学科学
domain: 生命科学
grade: 小学一至三年级

description: |
  知道动物和植物都有基本的生存需要：阳光、空气、水、适宜的温度、营养等。
  了解植物的生长需要：阳光、空气、水、无机盐、适宜的温度。
  了解动物的生存需要：食物、水、空气、栖息地、适宜的温度。
  知道动物根据食性可以分为植食动物、肉食动物和杂食动物。
  了解植物可以自己制造食物（光合作用），动物需要从外界获取食物。
  初步认识到生物的生存需要是相互关联的。

prerequisites:
  - id: SCI-LIFE-001
    name: 生物体具有一定的结构层次
    required: false

postrequisites:
  - id: SCI-LIFE-002
    name: 生物能适应其生存环境

key_concepts:
  - term: 生存需要
    definition: 生物维持生命活动所必需的条件
    importance: 核心
  - term: 光合作用
    definition: 植物利用阳光、二氧化碳和水制造有机物并释放氧气的过程
    importance: 核心
  - term: 食物链
    definition: 生物之间由于食物关系而形成的链状结构
    importance: 重要
  - term: 栖息地
    definition: 生物生活和繁衍的地方
    importance: 重要

misconceptions:
  - statement: "植物不需要空气"
    correction: "植物需要空气（二氧化碳和氧气）进行光合作用和呼吸作用"
    source: 义务教育科学课程标准（2022年版）
  - statement: "所有动物都吃植物"
    correction: "动物根据食性分为植食动物、肉食动物和杂食动物"
    source: 义务教育科学课程标准（2022年版）

cognitive_level:
  min_age: 7
  piaget_stage: 前运算阶段/具体运算阶段
  prerequisite_reasoning: 观察与归纳

activity_suggestions:
  - framework: 5E
    brief: Engage讨论生物需要什么才能生存→Explore观察并记录植物和动物的需要→Explain交流观察结果→Elaborate讨论如果缺少某种需要会怎样

verification:
