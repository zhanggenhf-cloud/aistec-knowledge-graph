interdisciplinary:
  - subject: 化学
    concept: 燃料的充分燃烧条件
    relation: 充分燃烧需要足够的氧气、适当的温度和充分的接触面积
  - subject: 地理
    concept: 能源结构与环境污染
    relation: 热机效率与化石燃料消耗、温室气体排放的关系
  - subject: 数学
    concept: 百分比计算
    relation: 效率计算涉及比例和百分数运算

