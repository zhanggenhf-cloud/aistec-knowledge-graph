id: PHYS-BUOY-003
name: 物体的浮沉条件
name_en: Floating and Sinking Conditions
subject: 物理
domain: 力学
grade: 初中八年级下

description: |
  能运用物体的浮沉条件说明生产生活中的有关现象。知道物体的浮沉取决于浮力与重力的关系：
  当F浮 > G时，物体上浮；当F浮 < G时，物体下沉；当F浮 = G时，物体悬浮或漂浮。
  了解潜水艇的浮沉原理，了解密度计的工作原理。
  能根据物体密度与液体密度的关系判断物体的浮沉状态。

prerequisites:
  - id: PHYS-BUOY-001
    name: 浮力
    required: true
  - id: PHYS-BUOY-002
    name: 阿基米德原理
    required: true
  - id: PHYS-FORCE-002
    name: 重力
    required: true

postrequisites:
  - id: PHYS-SIMPLE-003
    name: 机械效率

key_concepts:
  - term: 浮沉条件
    definition: 物体在液体中的浮沉取决于浮力与重力的大小关系
    importance: 核心
  - term: 上浮
    definition: F浮 > G，物体向上运动
    importance: 核心
  - term: 下沉
    definition: F浮 < G，物体向下运动
    importance: 核心
  - term: 悬浮
    definition: F浮 = G，物体可以停留在液体中任何深度
    importance: 核心
  - term: 漂浮
    definition: F浮 = G，物体静止在液面上，部分体积露出液面
    importance: 核心

misconceptions:
  - statement: "重的物体一定下沉，轻的物体一定上浮"
    correction: "浮沉取决于物体密度与液体密度的相对大小，而非绝对重量"
  - statement: "漂浮的物体比悬浮的物体受到的浮力小"
    correction: "漂浮和悬浮时F浮都等于G，只是排开液体的体积不同"
  - statement: "潜水艇是靠改变自身重力来浮沉的"
    correction: "潜水艇通过水舱充排水改变自身重力，从而实现浮沉控制"

cognitive_level:
  min_age: 13
  piaget_stage: 形式运算阶段
  prerequisite_reasoning: 综合分析与条件判断

activity_suggestions:
  - framework: 5E
    brief: Engage用鸡蛋在清水和盐水中浮沉引入 → Explore改变液体密度观察物体浮沉变化 → Explain归纳浮沉条件
  - framework: POE
    brief: 预测：橡皮泥捏成不同形状放入水中，浮沉状态会改变吗？
  - framework: IBL
    brief: 查阅资料，了解我国“奋斗者”号载人潜水器的深潜信息，讨论影响其所受液体压强和浮力大小的因素

verification:
  status: verified
  sources:
    - "义务教育物理课程标准（2022年版）"
  last_verified: 2024-09-14

interdisciplinary:
  - subject: 生物
    concept: 鱼类的浮沉调节与鱼鳔
    relation: 应用实例
  - subject: 工程
    concept: 潜水艇、密度计的设计原理
    relation: 应用实例
  - subject: 化学
    concept: 溶液密度与物质溶解度
    relation: 知识衔接

exhibits:
  - venue: 中国科技馆
    name: 浮沉条件互动装置
    relation: 演示不同密度物体在液体中的浮沉状态
  - venue: 中国科技馆
    name: 潜水艇模型
    relation: 展示浮沉原理在深海探测中的应用
