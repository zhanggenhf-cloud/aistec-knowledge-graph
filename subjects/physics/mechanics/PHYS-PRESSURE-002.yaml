id: PHYS-PRESSURE-002
name: 液体压强
name_en: Liquid Pressure
subject: 物理
domain: 力学
grade: 初中八年级下

description: |
  探究并了解液体压强与哪些因素有关。知道液体内部向各个方向都有压强，
  同一深度处液体向各个方向的压强相等。理解液体压强随深度的增加而增大，
  与液体的密度有关（p = ρgh）。了解连通器的原理及其应用，
  能解释船闸、茶壶等生活中的连通器实例。

prerequisites:
  - id: PHYS-PRESSURE-001
    name: 压强
    required: true
  - id: PHYS-MATTER-002
    name: 密度
    required: true

postrequisites:
  - id: PHYS-PRESSURE-003
    name: 大气压强
  - id: PHYS-BUOY-001
    name: 浮力

key_concepts:
  - term: 液体压强
    definition: 液体由于重力作用对容器底部和侧壁产生的压强
    importance: 核心
  - term: 液体压强公式
    definition: p = ρgh，液体压强与液体密度和深度成正比
    importance: 核心
  - term: 连通器
    definition: 上端开口、下端连通的容器，静止时各容器中的液面总保持相平
    importance: 重要
  - term: 帕斯卡定律
    definition: 加在密闭液体上的压强能够大小不变地由液体向各个方向传递（拓展）
    importance: 拓展

misconceptions:
  - statement: "液体只对容器底部有压强"
    correction: "液体对容器底部和侧壁都有压强，液体内部向各个方向都有压强"
  - statement: "液体压强与容器形状有关"
    correction: "液体压强只与液体密度和深度有关，与容器形状无关"
  - statement: "液体的重力越大，液体压强越大"
    correction: "液体压强取决于液体密度和深度，与液体总重力无关"

cognitive_level:
  min_age: 13
  piaget_stage: 形式运算阶段
  prerequisite_reasoning: 抽象思维与实验探究

activity_suggestions:
  - framework: 5E
    brief: Engage用潜水员为什么要穿抗压服引入 → Explore用液体压强计测量不同深度、不同方向的压强 → Explain归纳液体压强规律
  - framework: IBL
    brief: 探究液体压强与哪些因素有关（深度、密度、方向），运用控制变量法
  - framework: 项目式学习
    brief: 查阅资料，了解我国长江三峡水利枢纽工程中船闸是怎样利用连通器特点让轮船通行的

verification:
  status: verified
  sources:
    - "义务教育物理课程标准（2022年版）"
  last_verified: 2024-09-14

interdisciplinary:
  - subject: 数学
    concept: 比例关系与公式推导
    relation: 工具支撑
  - subject: 地理
    concept: 深海探测与海洋环境
    relation: 应用实例
  - subject: 工程
    concept: 水坝设计、船闸工程
    relation: 应用实例

exhibits:
