id: PHYS-MOTION-002
name: 速度
name_en: Velocity
subject: 物理
domain: 力学
grade: 初中八年级上

description: |
  能用速度描述物体运动的快慢，并能进行简单计算。理解速度是描述物体运动快慢的物理量，
  定义为路程与时间的比值（v = s/t）。会测量物体运动的速度，能运用速度公式解决简单的运动问题。
  了解匀速直线运动的概念，知道在实际问题中常用平均速度粗略描述变速直线运动的快慢。

prerequisites:
  - id: PHYS-MOTION-001
    name: 机械运动
    required: true

postrequisites:
  - id: PHYS-WORK-001
    name: 功
  - id: PHYS-ENERGY-001
    name: 动能和势能

key_concepts:
  - term: 速度
    definition: 描述物体运动快慢的物理量，等于路程与时间的比值
    importance: 核心
  - term: 速度公式
    definition: v = s/t，其中v为速度，s为路程，t为时间
    importance: 核心
  - term: 匀速直线运动
    definition: 物体沿直线运动且速度保持不变的运动
    importance: 核心
  - term: 平均速度
    definition: 物体在某段路程或某段时间内运动的平均快慢程度
    importance: 重要
  - term: 瞬时速度
    definition: 物体在某一时刻或某一位置的速度
    importance: 拓展

misconceptions:
  - statement: "速度大的物体运动的路程一定长"
    correction: "路程由速度和时间共同决定，速度大但时间短，路程不一定长"
  - statement: "平均速度就是速度的平均值"
    correction: "平均速度是总路程与总时间的比值，不等于各段速度的简单算术平均"
  - statement: "匀速直线运动的物体不受力"
    correction: "初中阶段不深入讨论，匀速直线运动可以是受力平衡的结果"

cognitive_level:
  min_age: 12
  piaget_stage: 形式运算阶段
  prerequisite_reasoning: 抽象思维与数学运算

activity_suggestions:
  - framework: 5E
    brief: Engage用运动会百米赛跑引入 → Explore用秒表和刻度尺测量小球通过某段距离的速度 → Explain分析数据得出速度概念
  - framework: POE
    brief: 预测并验证：两个小球以不同速度运动，比较相同时间内通过的路程
  - framework: IBL
    brief: 查阅资料，了解中国空间站在太空中飞行的速度大小，体会航天科技的成就

verification:
  status: verified
  sources:
    - "义务教育物理课程标准（2022年版）"
  last_verified: 2024-09-14

interdisciplinary:
  - subject: 数学
    concept: 比值、行程问题
    relation: 工具支撑
  - subject: 地理
    concept: 地图比例尺与距离计算
    relation: 应用实例
  - subject: 信息科技
    concept: 速度传感器与数据采集
    relation: 技术应用

exhibits:
  - venue: 中国科技馆
    name: 运动速度测量装置
    relation: 演示不同运动形式的速度测量方法
  - venue: 中国科技馆
    name: 中国空间站模型
    relation: 展示航天器飞行速度
