interdisciplinary:
  - subject: 化学
    concept: 原子结构与电子
    relation: 摩擦起电的微观解释需要原子结构知识
  - subject: 历史
    concept: 电学发展史
    relation: 富兰克林首先命名正电和负电

exhibits:
