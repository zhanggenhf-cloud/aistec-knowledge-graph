interdisciplinary:
  - subject: 生物
    concept: 生物电势
    relation: 细胞膜内外存在电势差（静息电位约-70mV），与神经传导有关
  - subject: 化学
    concept: 原电池
    relation: 化学能转化为电能，产生电压（如伏打电池）

exhibits:
  - venue: 中国科技馆
    name: 电压与电流
    relation: 通过水柱模型类比展示电压与电流的关系
  - venue: 上海科技馆
    name: 电力世界
    relation: 展示不同电压等级的输电和应用
