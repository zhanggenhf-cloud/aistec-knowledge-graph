id: PHYS-ELEC-010
name: 焦耳定律
name_en: Joule's Law
subject: 物理
domain: 电磁学
grade: 初中九年级

description: |
  电流通过导体时电能转化为内能，这种现象叫做电流的热效应。
  焦耳定律定量描述了电流产生的热量与哪些因素有关：
  电流通过导体产生的热量跟电流的二次方成正比，跟导体的电阻成正比，跟通电时间成正比。
  公式表示为：Q = I²Rt。

  在纯电阻电路中，电流做的功全部转化为内能，此时 Q = W = UIt = Pt = U²t/R。
  在非纯电阻电路中（如电动机），电流做的功只有部分转化为内能，W = UIt > Q = I²Rt，
  其余能量转化为机械能等其他形式的能。

  电热器是利用电流热效应工作的装置，如电炉、电热水器、电饭锅、电熨斗等。
  电热器的主要发热体是电阻率大、熔点高的电阻丝（如镍铬合金）。

  电热的利用和防止：利用方面包括加热、取暖、烘干等；
  防止方面包括电视机、电脑等电器上的散热孔和风扇，输电线采用粗导线减少发热损失等。

  学生应能理解焦耳定律的内容，会用公式计算电热，了解电热的利用和防止，
  能区分纯电阻电路和非纯电阻电路中电功与电热的关系。

prerequisites:
  - id: PHYS-ELEC-007
    name: 电功率
    required: true
  - id: PHYS-ELEC-006
    name: 欧姆定律
    required: true
  - id: PHYS-HEAT-001
    name: 内能
    required: false

postrequisites:
  - id: PHYS-ENERGY-003
    name: 能源与可持续发展

key_concepts:
  - term: 电流的热效应
    definition: 电流通过导体时电能转化为内能的现象
    importance: 核心
  - term: 焦耳定律
    definition: 电流产生的热量 Q = I²Rt，与电流平方、电阻、时间成正比
    importance: 核心
  - term: 电热器
    definition: 利用电流热效应工作的装置，发热体用电阻率大、熔点高的合金丝
    importance: 核心
  - term: 纯电阻电路
    definition: 电能全部转化为内能的电路，Q = W
    importance: 核心
  - term: 非纯电阻电路
    definition: 电能部分转化为内能、部分转化为其他形式能量的电路，W > Q
    importance: 核心
  - term: 电热的防止
    definition: 通过散热片、风扇、粗导线等方式减少不必要的热损失
    importance: 重要

misconceptions:
  - statement: "Q = UIt 适用于所有电路计算电热"
    correction: "Q = I²Rt 是计算电热的普适公式；Q = UIt = U²t/R 只适用于纯电阻电路"
  - statement: "电阻越大产生的热量一定越多"
    correction: "由 Q = I²Rt 或 Q = U²t/R 可知，热量还与电流（或电压）和时间有关；需要控制变量"
  - statement: "电热都是有用的，不需要防止"
    correction: "电热在很多情况下是有害的，会导致电器过热、能量浪费甚至火灾，需要散热"
  - statement: "电动机线圈发热可以用 Q = U²t/R 计算"
    correction: "电动机是非纯电阻电路，线圈电压U不等于电源电压，只能用 Q = I²Rt 计算"
  - statement: "串联电路中电阻大的产生热量少"
    correction: "串联电流相同，由 Q = I²Rt 可知，电阻越大产生热量越多"

cognitive_level:
  min_age: 14
  piaget_stage: 形式运算阶段
  prerequisite_reasoning: 能量转化与守恒分析

activity_suggestions:
  - framework: 探究实验
    brief: 探究电流通过导体产生的热量与电流、电阻、时间的关系（焦耳定律实验装置）
  - framework: 5E
    brief: Engage电热器的使用经验→Explore比较不同电阻丝发热→Explain焦耳定律→Elaborate分析电动机发热与输出功率
  - framework: 计算练习
    brief: 区分纯电阻和非纯电阻电路，选择正确公式计算电热和电功
  - framework: 项目式学习
    brief: 设计一个简易电热器（如保温装置），计算所需电阻丝规格和功率

verification:
  status: verified
  sources:
