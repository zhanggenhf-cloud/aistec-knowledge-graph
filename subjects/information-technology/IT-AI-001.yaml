id: IT-AI-001
name: 人工智能初探
name_en: Introduction to Artificial Intelligence
subject: 信息科技
domain: 人工智能
grade: 初中七年级

description: |
  了解人工智能的基本概念、发展历程和应用领域。
  体验语音识别、图像识别、自然语言处理等常见AI应用。
  理解机器学习的基本思想：从数据中学习规律。
  认识人工智能的伦理问题和社会影响，培养负责任的技术使用意识。

prerequisites:
  - id: IT-ALGO-001
    name: 算法基础
    required: true
  - id: IT-DATA-002
    name: 数据的组织与编码
    required: true

postrequisites:
  - id: IT-SEC-001
    name: 信息安全与隐私保护

key_concepts:
  - term: 人工智能
    definition: 使机器模拟、延伸和扩展人类智能的技术
    importance: 核心
  - term: 机器学习
    definition: 让计算机从数据中自动学习规律的方法
    importance: 核心
  - term: 图像识别
    definition: 让计算机识别和理解图像内容的技术
    importance: 重要
  - term: 自然语言处理
    definition: 让计算机理解和生成人类语言的技术
    importance: 重要
  - term: AI伦理
    definition: 人工智能开发和应用中涉及的道德和社会问题
    importance: 重要

misconceptions:
  - statement: "人工智能会像人一样思考"
    correction: "当前AI是基于数据和算法的模式匹配，不具备人类的意识、情感和真正理解能力"
    source: 义务教育信息科技课程标准（2022年版）
  - statement: "人工智能无所不能"
    correction: "AI在特定任务上表现优异，但在通用智能、创造性思维等方面仍有局限"
    source: 义务教育信息科技课程标准（2022年版）

cognitive_level:
  min_age: 12
  piaget_stage: 形式运算阶段
  prerequisite_reasoning: 抽象思维与伦理判断

activity_suggestions:
  - framework: 5E
    brief: Engage体验AI语音识别/图像识别→Explore用可视化工具训练简单分类模型→Explain讨论AI决策的透明性
  - framework: 项目式学习
    brief: 用AI工具完成一个分类任务（如植物识别），分析其准确率和局限性

verification:
  status: verified
  sources:
    - "义务教育信息科技课程标准（2022年版）"
  last_verified: '2024-09-13'

interdisciplinary:
  - subject: 数学
    concept: 统计与概率
    relation: 原理支撑
  - subject: 科学
    concept: 传感器与数据采集
    relation: 技术应用
  - subject: 道德与法治
    concept: 技术伦理与法律规范
    relation: 价值引领

exhibits:
  - venue: 中国科技馆
    name: 人工智能展厅
    relation: 展示AI技术与应用
