id: IT-ALGO-001
name: 算法基础
name_en: Algorithm Fundamentals
subject: 信息科技
domain: 算法
grade: 小学五年级

description: |
  理解算法的概念：解决问题的一系列明确步骤。
  能够用自然语言、流程图等方式描述简单算法。
  体验顺序、分支、循环三种基本控制结构。
  培养计算思维，能够分解复杂问题并设计解决步骤。

prerequisites:
  - id: IT-DATA-001
    name: 数据与信息
    required: true
  - id: MATH-NUM-001
    name: 数与运算
    required: false

postrequisites:
  - id: IT-ALGO-002
    name: 程序设计基础
  - id: IT-AI-001
    name: 人工智能初探

key_concepts:
  - term: 算法
    definition: 解决问题的一系列明确、有限的步骤
    importance: 核心
  - term: 顺序结构
    definition: 按照先后顺序依次执行的步骤
    importance: 核心
  - term: 分支结构
    definition: 根据条件判断选择不同执行路径
    importance: 核心
  - term: 循环结构
    definition: 重复执行某段步骤直到满足条件
    importance: 核心
  - term: 流程图
    definition: 用图形符号表示算法的工具
    importance: 重要

misconceptions:
  - statement: "算法就是计算机程序"
    correction: "算法是解决问题的步骤描述，程序是算法在计算机上的实现"
    source: 义务教育信息科技课程标准（2022年版）
  - statement: "算法只能用在计算机里"
    correction: "算法存在于日常生活各处，如烹饪食谱、路线导航、游戏规则等"
    source: 义务教育信息科技课程标准（2022年版）

cognitive_level:
  min_age: 10
  piaget_stage: 具体运算阶段
  prerequisite_reasoning: 逻辑推理与步骤分解

activity_suggestions:
  - framework: 5E
    brief: Engage用"猜数字"游戏引入→Explore设计查找算法→Explain比较不同算法的效率
  - framework:  unplugged编程
    brief: 不插电活动：用身体动作演示排序算法，如冒泡排序

verification:
  status: verified
  sources:
    - "义务教育信息科技课程标准（2022年版）"
  last_verified: '2024-09-13'

interdisciplinary:
  - subject: 数学
    concept: 逻辑推理与问题求解
    relation: 思维共享
  - subject: 科学
    concept: 实验步骤设计
    relation: 方法衔接

exhibits:
  - venue: 中国科技馆
    name: 编程体验区
    relation: 可视化展示算法执行过程
