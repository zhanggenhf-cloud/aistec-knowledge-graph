id: GEO-EARTH-003
name: 天气与气候
name_en: Weather and Climate
subject: 地理
domain: 认识全球
subdomain: 地球的表层
grade: 初中七年级

description: |
  区分天气与气候的概念。
  识别常见的天气符号，能够阅读简单的天气预报图，模拟播报天气。
  阅读世界年平均气温和1月、7月平均气温分布图，描述和简要归纳世界气温分布特点。
  阅读世界年降水量分布图，描述和简要归纳世界降水分布特点。
  阅读某地区气温、降水数据资料，绘制气温曲线图和降水量柱状图，说出气温与降水量随时间变化的特点。
  阅读世界气候类型分布图，描述世界主要气候类型的分布特征；结合实例，说明纬度位置、海陆分布、地形等对气候的影响。
  结合实例，说明天气和气候对人们生产生活的影响。
  认识人类活动对气候的影响，树立环境保护意识。

prerequisites:
  - id: SCI-WEATHER-001
    name: 天气与气候（小学）
    required: true
  - id: GEO-EARTH-004
    name: 地球的运动
    required: false

postrequisites:
  - id: GEO-ENV-001
    name: 自然资源与环境保护
  - id: SCI-EARTH-003
    name: 地球上的水

key_concepts:
  - term: 天气
    definition: 一个地区短时间内的大气状况
    importance: 核心
  - term: 气候
    definition: 一个地区多年的天气平均状况
    importance: 核心
  - term: 气温分布
    definition: 受纬度、海陆、地形等因素影响的气温空间变化规律
    importance: 核心
  - term: 降水分布
    definition: 受纬度、海陆、地形、洋流等因素影响的降水空间变化规律
    importance: 核心
  - term: 气候类型
    definition: 根据气温和降水组合特征划分的气候分类
    importance: 重要
  - term: 影响气候的因素
    definition: 纬度位置、海陆分布、地形等因素对气候的影响
    importance: 核心

misconceptions:
  - statement: "天气和气候是一回事"
    correction: "天气是短时间的，气候是长时间的平均状况"
    source: 义务教育地理课程标准（2022年版）
  - statement: "全球变暖就是所有地方都变热"
    correction: "全球变暖指全球平均气温上升，但不同地区变化不同，还可能引发极端天气"
    source: IPCC报告

cognitive_level:
  min_age: 12
  piaget_stage: 形式运算阶段
  prerequisite_reasoning: 系统思维与因果分析

activity_suggestions:
  - framework: 5E
    brief: Engage观察一周天气变化→Explore分析气温降水数据→Explain归纳气候类型特征
  - framework: 项目式学习
    brief: 设计"家乡气候档案"，收集数据、绘制图表、分析成因

verification:
