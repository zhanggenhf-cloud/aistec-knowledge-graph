id: GEO-EARTH-001
name: 地球在宇宙中
name_en: Earth in the Universe
subject: 地理
domain: 认识全球
subdomain: 地球的宇宙环境
grade: 初中七年级

description: |
  认识地球在宇宙中的位置，描述地球的宇宙环境、地球在太阳系中的位置。
  使用数据、类比等方式描述地球的大小，说出人类对地球形状的认识过程。
  了解探月工程、火星探测以及空间站建设等人类太空探索的进展与意义。
  收集中国航天及太空观测发展的相关材料，认识中国太空探索的成就。
  初步建立科学的宇宙观，认识地球是人类唯一的家园。

prerequisites:
  - id: SCI-EARTH-001
    name: 地球的形状与大小（小学科学）
    required: true

postrequisites:
  - id: GEO-EARTH-004
    name: 地球的运动
  - id: GEO-EARTH-002
    name: 地图的阅读与使用

key_concepts:
  - term: 地球形状
    definition: 两极稍扁、赤道略鼓的不规则球体
    importance: 核心
  - term: 太阳系
    definition: 以太阳为中心，包括八大行星及其卫星、小行星、彗星等天体系统
    importance: 核心
  - term: 地球在太阳系中的位置
    definition: 地球是太阳系中距离太阳第三近的行星，处于适宜生命存在的宜居带
    importance: 核心
  - term: 人类太空探索
    definition: 包括探月工程、火星探测、空间站建设等航天活动
    importance: 重要
  - term: 中国航天成就
    definition: 嫦娥探月、天问火星探测、天宫空间站建设等
    importance: 重要

misconceptions:
  - statement: "地球是宇宙的中心"
    correction: "地球只是太阳系中一颗普通行星，太阳系的中心是太阳"
    source: 义务教育地理课程标准（2022年版）
  - statement: "地球是完美的球体"
    correction: "地球是一个两极稍扁、赤道略鼓的不规则球体"
    source: 义务教育地理课程标准（2022年版）

cognitive_level:
  min_age: 12
  piaget_stage: 形式运算阶段
  prerequisite_reasoning: 空间想象与抽象思维

activity_suggestions:
  - framework: 5E
    brief: Engage观看太空探索视频→Explore用软件模拟太阳系→Explain讨论地球在宇宙中的位置
  - framework: 项目式学习
    brief: 收集中国航天成就资料，制作"中国太空探索"主题手抄报

verification:
