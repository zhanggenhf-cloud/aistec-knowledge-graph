    relation: 原理支撑
  - subject: 物理
    concept: 新能源技术（太阳能、风能）
    relation: 技术应用
  - subject: 生物
    concept: 生态平衡与物种保护
    relation: 知识衔接
  - subject: 道德与法治
    concept: 生态文明与法治保障
    relation: 价值引领
  - subject: 信息科技
