id: MATH-MEAS-001
name: 测量与单位
name_en: Measurement and Units
subject: 数学
domain: 数与代数
grade: 跨学段

description: |
  理解测量的意义，认识常用计量单位（长度、质量、时间、角度等）。
  掌握单位换算的基本方法，能够在实际情境中选择合适的单位。
  了解国际单位制（SI）的基本思想。
  培养量感，能够对物理量进行合理估计。

prerequisites:
  - id: MATH-NUM-001
    name: 数与运算
    required: false

postrequisites:
  - id: PHYS-MOTION-002
    name: 速度
  - id: PHYS-MATTER-001
    name: 质量
  - id: CHEM-MAT-001
    name: 物质的量

key_concepts:
  - term: 量感
    definition: 对事物的可测量属性及大小关系的直观感知
    importance: 核心
  - term: 单位换算
    definition: 同一物理量在不同单位之间的转换
    importance: 核心
  - term: 国际单位制
    definition: 国际通用的计量单位体系，包括米、千克、秒等基本单位
    importance: 重要
  - term: 误差
    definition: 测量值与真实值之间的差异
    importance: 重要
  - term: 有效数字
    definition: 测量中实际有意义的数字位数
    importance: 拓展

misconceptions:
  - statement: "测量可以完全精确"
    correction: "任何测量都存在误差，误差只能通过改进方法减小，不能完全消除"
    source: 义务教育数学课程标准（2022年版）
  - statement: "单位换算就是乘以或除以10"
    correction: "不同物理量的进率不同，如时间60进制、角度360进制等"
    source: 义务教育数学课程标准（2022年版）

cognitive_level:
  min_age: 8
  piaget_stage: 具体运算阶段
  prerequisite_reasoning: 数感与空间感知

activity_suggestions:
  - framework: 5E
    brief: Explore用不同工具测量同一物体→Explain讨论测量误差来源→Elaborate设计更精确的测量方案
  - framework: POE
    brief: 估计教室长度，然后用工具测量验证，对比估计值与测量值

verification:
  status: verified
  sources:
    - "义务教育数学课程标准（2022年版）"
  last_verified: '2024-09-13'

interdisciplinary:
  - subject: 物理
    concept: 物理量的测量
    relation: 应用支撑
  - subject: 科学
    concept: 科学探究中的观察与测量
    relation: 方法衔接
  - subject: 化学
    concept: 化学实验中的定量操作
    relation: 应用支撑

exhibits:
  - venue: 中国科技馆
    name: 计量科学展厅
    relation: 展示精密测量技术与发展
