- subject: 道德与法治
  connection: 疫苗管理法；传染病防治中的公民责任
- subject: 体育与健康
  connection: 健康生活方式与增强免疫力
- subject: 历史
  connection: 疫苗发展史（如琴纳发明牛痘疫苗）
exhibits:
