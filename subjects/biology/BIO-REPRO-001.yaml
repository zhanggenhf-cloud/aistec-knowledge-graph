  connection: 生殖细胞的化学成分；胚胎发育中的生化变化
- subject: 道德与法治
  connection: 生殖健康权利；未成年人保护法
- subject: 劳动教育
  connection: 植物扦插和嫁接的农业技术
- subject: 美术
  connection: 生物绘图中对生殖结构的观察和描绘
exhibits:
- name: 生命奥秘
  location: 中国科技馆
  relevance: 展示生物生殖和发育的过程
- name: 昆虫世界
  location: 上海自然博物馆
  relevance: 展示昆虫变态发育的完整过程
