  connection: 消毒剂的化学原理；疫苗的制备涉及生物化学
- subject: 道德与法治
  connection: 传染病防治法；突发公共卫生事件应急条例
- subject: 体育与健康
  connection: 健康生活方式与增强免疫力
- subject: 历史
  connection: 人类与传染病斗争的历史（如天花灭绝）
