id: BIO-PLANT-001
name: 植物的光合作用
name_en: Photosynthesis in Plants
subject: 生物
domain: 生命科学
grade: 初中七年级上
description: |
  光合作用是绿色植物通过叶绿体，利用光能，把二氧化碳和水转化成储存能量的有机物，并且释放出氧气的过程。根据2022版义务教育生物学课程标准，学生需要理解光合作用的概念和意义，认识光合作用的原料、条件和产物，了解光合作用在生物圈中的重要作用。

  光合作用的场所是叶绿体，主要发生在植物的绿色部分，尤其是叶片。光合作用需要光作为能量来源，以二氧化碳和水为原料，产物是有机物（主要是淀粉）和氧气。光合作用的实质是将光能转化为化学能，储存在有机物中。这一过程不仅为植物自身的生长发育提供物质和能量，也是生态系统中几乎所有生物的食物和能量来源。

  学生应通过"绿叶在光下制造有机物"的实验，验证光合作用的产物是淀粉，理解光合作用需要光的条件。同时，通过"光合作用吸收二氧化碳释放氧气"的实验，进一步认识光合作用的原料和产物。通过学习光合作用，学生应建立"物质与能量观"，认识到光合作用是生物圈中物质循环和能量流动的起点，对维持大气中碳-氧平衡具有重要意义。
prerequisites:
- id: BIO-CELL-002
  name: 细胞的结构与功能
  required: true
- id: BIO-PLANT-003
  name: 植物的结构层次
  required: false
postrequisites:
- id: BIO-PLANT-002
  name: 植物的呼吸作用
  required: false
- id: BIO-ECO-002
  name: 生态系统
  required: false
key_concepts:
- term: 光合作用
  definition: 绿色植物通过叶绿体，利用光能，把二氧化碳和水转化成储存能量的有机物，并释放氧气的过程
  importance: 核心
- term: 叶绿体
  definition: 植物细胞中进行光合作用的细胞器，含有叶绿素等色素
  importance: 核心
- term: 叶绿素
  definition: 存在于叶绿体中的绿色色素，能吸收光能，是光合作用的关键物质
  importance: 核心
- term: 光能
  definition: 太阳辐射的能量，是光合作用的能量来源
  importance: 核心
- term: 有机物
  definition: 光合作用制造的含碳化合物，如淀粉、葡萄糖等，储存化学能
  importance: 核心
- term: 碳-氧平衡
  definition: 生物圈中二氧化碳和氧气的相对稳定状态，光合作用对此起关键作用
  importance: 核心
misconceptions:
- misconception: 光合作用只在白天进行
  correction: 光反应必须在光下进行，但暗反应不需要光，在有光无光条件下都能进行
- misconception: 植物光合作用只在叶片中进行
  correction: 光合作用主要在叶片中进行，但任何含有叶绿体的绿色部分（如幼嫩的茎、绿色的果实）都能进行光合作用
- misconception: 光合作用的产物只有氧气
  correction: 光合作用的产物是有机物（主要是淀粉）和氧气，有机物才是储存能量的主要产物
- misconception: 光合作用与呼吸作用是相反的过程，两者互不相关
  correction: 光合作用与呼吸作用有密切联系，光合作用制造的有机物和氧气是呼吸作用的原料，呼吸作用释放的二氧化碳是光合作用的原料
activity_suggestions:
- title: 绿叶在光下制造有机物
  type: 探究实验
  description: 通过暗处理、部分遮光、光照、脱色、滴加碘液等步骤，验证光合作用产生淀粉
  duration: 2课时
  materials:
  - 盆栽天竺葵
  - 黑纸片
  - 酒精
  - 碘液
  - 烧杯
  - 三脚架
  - 石棉网
  - 酒精灯
- title: 光合作用吸收二氧化碳释放氧气
  type: 探究实验
  description: 利用金鱼藻在光下释放氧气的实验，收集并检验光合作用产生的气体
  duration: 45分钟
  materials:
  - 金鱼藻
  - 大烧杯
  - 漏斗
  - 试管
  - 清水
  - 火柴
- title: 探究光合作用的原料
  type: 探究实验
  description: 设计实验探究二氧化碳是光合作用的原料，利用氢氧化钠溶液吸收二氧化碳进行对比
  duration: 2课时
  materials:
  - 盆栽植物
  - 透明塑料袋
  - 氢氧化钠溶液
  - 清水
  - 碘液
- title: 光合作用的场所——叶绿体
  type: 观察活动
  description: 观察叶片的横切面永久装片，认识栅栏组织和海绵组织中的叶绿体分布
  duration: 35分钟
  materials:
  - 显微镜
  - 叶片横切面永久装片
