id: BIO-CELL-002
name: 细胞的结构与功能
name_en: Cell Structure and Function
subject: 生物
domain: 生命科学
grade: 初中七年级上
description: |
  细胞虽然微小，但内部结构精密复杂，各部分结构既有明确分工又密切协作，共同完成细胞的生命活动。根据2022版义务教育生物学课程标准，学生需要认识植物细胞和动物细胞的基本结构，理解细胞各结构的功能，并比较两者的异同。

  植物细胞的基本结构包括细胞壁、细胞膜、细胞质、细胞核、液泡、叶绿体和线粒体等。动物细胞的基本结构包括细胞膜、细胞质、细胞核和线粒体等。细胞壁位于植物细胞最外层，具有支持和保护作用；细胞膜控制物质进出细胞，维持细胞内部环境的相对稳定；细胞核是细胞的控制中心，含有遗传物质，控制细胞的生长、发育和遗传；细胞质是细胞代谢的主要场所，其中分布着多种细胞器。

  学生应通过显微镜观察动植物细胞的永久装片或临时装片，识别细胞的主要结构，理解"结构与功能相适应"这一核心生命观念。例如，叶绿体含有叶绿素，是植物进行光合作用的场所；线粒体是细胞进行呼吸作用的主要场所，为细胞生命活动提供能量。通过比较动植物细胞结构的异同，学生应认识到不同类型细胞在结构上的适应性变化，以及细胞结构的统一性与多样性。
prerequisites:
- id: BIO-CELL-001
  name: 细胞是生命活动的基本单位
  required: true
postrequisites:
- id: BIO-CELL-003
  name: 细胞的生活
  required: true
- id: BIO-PLANT-001
  name: 植物的光合作用
  required: false
key_concepts:
- term: 细胞膜
  definition: 包围在细胞质外层的薄膜，具有控制物质进出、保护细胞的作用
  importance: 核心
- term: 细胞质
  definition: 细胞膜以内、细胞核以外的部分，是细胞代谢的主要场所
  importance: 核心
- term: 细胞核
  definition: 细胞的控制中心，含有遗传物质DNA，控制细胞的生长、发育和遗传
  importance: 核心
- term: 细胞壁
  definition: 植物细胞外层的结构，主要由纤维素构成，具有支持和保护细胞的作用
  importance: 核心
- term: 叶绿体
  definition: 植物细胞中特有的细胞器，含有叶绿素，是光合作用的场所
  importance: 核心
- term: 线粒体
  definition: 细胞进行呼吸作用的主要场所，被称为"细胞的动力车间"
  importance: 核心
- term: 液泡
  definition: 植物细胞中较大的泡状结构，内含细胞液，具有储存物质、维持细胞形态的作用
  importance: 重要
misconceptions:
- misconception: 所有细胞都有细胞壁
  correction: 只有植物细胞、细菌和真菌细胞有细胞壁，动物细胞没有细胞壁
- misconception: 细胞核是所有细胞的控制中心
  correction: 大多数真核细胞的控制中心是细胞核，但原核细胞没有成形的细胞核，其遗传物质集中在拟核区
- misconception: 叶绿体存在于所有植物细胞中
  correction: 叶绿体只存在于植物的绿色部分细胞中，如叶肉细胞；根细胞等非绿色部分没有叶绿体
- misconception: 动物细胞比植物细胞简单，所以功能更弱
  correction: 动植物细胞各有适应其功能的特化结构，不能简单比较强弱。动物细胞没有细胞壁，形态更灵活，利于运动和变形
activity_suggestions:
- title: 观察动植物细胞永久装片
  type: 探究实验
  description: 使用显微镜观察洋葱鳞片叶表皮细胞和人口腔上皮细胞永久装片，识别细胞各结构
  duration: 40分钟
  materials:
  - 光学显微镜
  - 动植物细胞永久装片
- title: 比较动植物细胞结构
  type: 模型建构
  description: 制作动植物细胞结构模型或绘制细胞结构图，标注各部分名称并比较异同
  duration: 45分钟
  materials:
  - 橡皮泥或卡纸
  - 彩色笔
  - A4纸
- title: 细胞膜的选择透过性模拟实验
  type: 探究实验
  description: 用透析袋模拟细胞膜，探究细胞膜控制物质进出的功能
  duration: 50分钟
  materials:
  - 透析袋
  - 淀粉溶液
  - 碘液
  - 葡萄糖溶液
  - 本尼迪克特试剂
- title: 细胞结构功能连连看
  type: 互动游戏
  description: 通过卡片配对游戏，将细胞结构与其功能对应起来，巩固知识
  duration: 20分钟
  materials:
  - 结构卡片
  - 功能卡片
cognitive_level:
  min_age: 12
  piaget_stage: 形式运算阶段
  prerequisite_reasoning: 抽象思维
verification:
  status: verified
  sources:
