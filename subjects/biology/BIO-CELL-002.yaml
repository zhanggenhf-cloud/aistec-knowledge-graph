  last_verified: '2024-06-01'
interdisciplinary:
- subject: 物理
  connection: 显微镜的光学成像原理；细胞膜的选择透过性与半透膜原理
- subject: 化学
  connection: 细胞膜的磷脂双分子层结构涉及化学分子知识；细胞器内的生化反应
- subject: 美术
  connection: 细胞结构图的绘制与生物绘图规范
- subject: 数学
  connection: 细胞的微小尺寸和表面积与体积比
exhibits:
- name: 细胞结构模型
  location: 中国科技馆
  relevance: 展示动植物细胞的三维结构模型
- name: 微观世界
  location: 上海自然博物馆
  relevance: 通过高倍显微镜和电子显微镜图像展示细胞内部结构
