id: CHEM-METAL-002
name: 金属的化学性质
name_en: Chemical Properties of Metals
subject: 化学
domain: 物质的性质与应用
grade: 初中九年级

description: |
  认识金属的化学性质：与氧气反应、与酸反应、与盐溶液反应。
  了解金属活动性顺序，能根据金属活动性顺序判断金属的化学性质。
  能通过实验说明常见金属的主要化学性质，并能用化学方程式表示。
  了解金属腐蚀的原因和防护方法。

prerequisites:
  - id: CHEM-METAL-001
    name: 金属
    required: true
  - id: CHEM-ACID-001
    name: 常见的酸和碱
    required: true

postrequisites: []

key_concepts:
  - term: 金属活动性顺序
    definition: 钾钙钠镁铝锌铁锡铅（氢）铜汞银铂金，从左到右活动性逐渐减弱
    importance: 核心
  - term: 金属与氧气反应
    definition: 活泼金属容易与氧气反应生成金属氧化物
    importance: 核心
  - term: 金属与酸反应
    definition: 活泼金属能与酸反应生成盐和氢气
    importance: 核心
  - term: 金属与盐反应
    definition: 活泼金属能将不活泼金属从其盐溶液中置换出来
    importance: 核心
  - term: 金属腐蚀
    definition: 金属与周围环境中的物质发生化学反应而受到损坏
    importance: 重要

misconceptions:
  - statement: "所有金属都能与酸反应"
    correction: "只有排在氢前面的金属才能与酸反应生成氢气"
    source: 义务教育化学课程标准（2022年版）
  - statement: "铁生锈是铁与氧气反应"
    correction: "铁生锈是铁与氧气、水共同作用的结果"
    source: 义务教育化学课程标准（2022年版）

cognitive_level:
  min_age: 14
  piaget_stage: 形式运算阶段
  prerequisite_reasoning: 实验观察与推理

activity_suggestions:
