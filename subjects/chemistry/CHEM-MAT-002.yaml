id: CHEM-MAT-002
name: 纯净物与混合物
name_en: Pure Substances and Mixtures
subject: 化学
domain: 物质的性质与应用
grade: 初中九年级

description: |
  认识纯净物和混合物的概念，能根据物质的组成判断其属于纯净物还是混合物。
  了解混合物的分离方法：过滤、蒸发、蒸馏等。
  初步学习使用过滤、蒸发的方法对混合物进行分离。
  通过实验探究，理解混合物分离的原理和方法。

prerequisites:
  - id: CHEM-MAT-001
    name: 物质的多样性
    required: true

postrequisites:
  - id: CHEM-SOL-001
    name: 溶液

key_concepts:
  - term: 纯净物
    definition: 由一种物质组成，有固定的组成和性质
    importance: 核心
  - term: 混合物
    definition: 由两种或两种以上物质混合而成，各组分保持各自的性质
    importance: 核心
  - term: 过滤
    definition: 利用物质的溶解性差异，将不溶性固体与液体分离的方法
    importance: 重要
  - term: 蒸发
    definition: 利用溶剂挥发，将可溶性固体从溶液中分离的方法
    importance: 重要
  - term: 蒸馏
    definition: 利用物质沸点不同，将液体混合物分离的方法
    importance: 重要

misconceptions:
  - statement: "纯净物一定比混合物好"
    correction: "纯净物和混合物各有用途，不能简单地说谁好谁坏"
    source: 义务教育化学课程标准（2022年版）

cognitive_level:
  min_age: 14
  piaget_stage: 形式运算阶段
  prerequisite_reasoning: 分类与实验操作

activity_suggestions:
  - framework: 5E
    brief: Explore进行粗盐提纯实验→Explain分析过滤和蒸发的原理→Elaborate设计其他混合物的分离方案

verification:
  status: verified
  sources:
    - "义务教育化学课程标准（2022年版）"
  last_verified: '2026-09-13'

interdisciplinary:
