id: CHEM-ACID-001
name: 常见的酸和碱
name_en: Common Acids and Bases
subject: 化学
domain: 物质的性质与应用
grade: 初中九年级

description: |
  认识常见的酸（盐酸、硫酸）和碱（氢氧化钠、氢氧化钙）的性质。
  能通过实验说明常见的酸和碱的主要性质，并能用化学方程式表示。
  学会用酸碱指示剂、pH试纸检验溶液的酸碱性。
  了解酸碱中和反应及其应用。
  能举例说明物质性质的广泛应用及性质与用途的关系。

prerequisites:
  - id: CHEM-MAT-003
    name: 单质与化合物
    required: true
  - id: CHEM-SCI-001
    name: 科学探究与化学实验
    required: true

postrequisites:
  - id: CHEM-ACID-002
    name: 酸碱中和

key_concepts:
  - term: 酸
    definition: 电离时生成的阳离子全部是氢离子的化合物
    importance: 核心
  - term: 碱
    definition: 电离时生成的阴离子全部是氢氧根离子的化合物
    importance: 核心
  - term: 酸碱指示剂
    definition: 能在酸性或碱性溶液中显示不同颜色的物质
    importance: 核心
  - term: pH
    definition: 表示溶液酸碱性强弱的数值，pH<7为酸性，pH>7为碱性
    importance: 核心
  - term: 酸的通性
    definition: 酸能使指示剂变色、与活泼金属反应、与金属氧化物反应、与碱反应等
    importance: 重要
  - term: 碱的通性
    definition: 碱能使指示剂变色、与非金属氧化物反应、与酸反应等
    importance: 重要

misconceptions:
  - statement: "酸性溶液一定是酸溶液"
    correction: "酸性溶液不一定是酸溶液，某些盐溶液（如氯化铵）也呈酸性"
    source: 义务教育化学课程标准（2022年版）
  - statement: "pH试纸可以直接浸入溶液中"
    correction: "pH试纸应该用玻璃棒蘸取溶液滴在试纸上，不能直接浸入"
    source: 义务教育化学课程标准（2022年版）

cognitive_level:
  min_age: 14
  piaget_stage: 形式运算阶段
  prerequisite_reasoning: 实验观察与归纳

activity_suggestions:
