id: CHEM-REACT-001
name: 化学变化与物理变化
name_en: Chemical and Physical Changes
subject: 化学
domain: 物质的化学变化
grade: 初中九年级

description: |
  知道物质是在不断变化的，物质变化分为物理变化和化学变化。
  认识化学变化是产生新物质的过程，知道化学变化常伴随生成沉淀、产生气体、发生颜色变化、发光，以及吸热或放热等现象。
  能从宏观和微观的视角说明物理变化和化学变化的区别。
  初步形成变化观。

prerequisites:
  - id: CHEM-MAT-001
    name: 物质的多样性
    required: true

postrequisites:
  - id: CHEM-REACT-003
    name: 质量守恒定律
  - id: CHEM-REACT-002
    name: 化学方程式

key_concepts:
  - term: 物理变化
    definition: 没有新物质生成的变化，如状态变化、形状变化
    importance: 核心
  - term: 化学变化
    definition: 有新物质生成的变化，常伴随发光、发热、变色、产生气体、生成沉淀等现象
    importance: 核心
  - term: 变化观
    definition: 认识物质是在不断变化的，变化遵循一定规律的观念
    importance: 核心

misconceptions:
  - statement: "有发光发热现象的一定是化学变化"
    correction: "发光发热不一定是化学变化，如灯泡发光发热是物理变化"
    source: 义务教育化学课程标准（2022年版）
  - statement: "化学变化一定比物理变化剧烈"
    correction: "化学变化的剧烈程度各不相同，有些化学变化很缓慢"
    source: 义务教育化学课程标准（2022年版）

cognitive_level:
  min_age: 14
  piaget_stage: 形式运算阶段
  prerequisite_reasoning: 观察与判断

activity_suggestions:
  - framework: 5E
    brief: Explore观察各种变化现象→Explain区分物理变化和化学变化→Elaborate判断日常生活中的变化类型

verification:
  status: verified
  sources:
    - "义务教育化学课程标准（2022年版）"
  last_verified: '2026-09-13'

interdisciplinary:
  - subject: 物理
    concept: 物态变化
    relation: 知识衔接
  - subject: 科学
    concept: 物质的变化（小学科学）
    relation: 前置衔接

exhibits:
  - venue: 中国科技馆
    name: 化学变化展示
    relation: 展示化学变化的奇妙现象
