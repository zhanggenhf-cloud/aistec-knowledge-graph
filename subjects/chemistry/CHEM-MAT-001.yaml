id: CHEM-MAT-001
name: 物质的多样性
name_en: Diversity of Matter
subject: 化学
domain: 物质的性质与应用
grade: 初中九年级

description: |
  认识物质具有多样性，物质可以分为不同的类别。
  能依据物质的组成对物质进行分类，识别纯净物和混合物、单质和化合物。
  能依据物质的类别列举一些简单的单质、氧化物、酸、碱、盐及生活中常见的有机物。
  初步形成基于物质类别研究物质及其变化的视角。

prerequisites:
  - id: CHEM-SCI-001
    name: 科学探究与化学实验
    required: true

postrequisites:
  - id: CHEM-MAT-002
    name: 纯净物与混合物
  - id: CHEM-MAT-003
    name: 单质与化合物
  - id: CHEM-MAT-004
    name: 氧化物

key_concepts:
  - term: 纯净物
    definition: 由一种物质组成的物质
    importance: 核心
  - term: 混合物
    definition: 由两种或两种以上物质混合而成的物质
    importance: 核心
  - term: 单质
    definition: 由同种元素组成的纯净物
    importance: 核心
  - term: 化合物
    definition: 由不同种元素组成的纯净物
    importance: 核心
  - term: 氧化物
    definition: 由两种元素组成，其中一种是氧元素的化合物
    importance: 核心

misconceptions:
  - statement: "混合物一定是不纯净的物质"
    correction: "混合物是由多种物质混合而成，各组分保持各自的性质，不能说'不纯净'"
    source: 义务教育化学课程标准（2022年版）
  - statement: "含氧元素的化合物就是氧化物"
    correction: "氧化物必须由两种元素组成，其中一种是氧元素；含氧的化合物不一定是氧化物"
    source: 义务教育化学课程标准（2022年版）

cognitive_level:
  min_age: 14
  piaget_stage: 形式运算阶段
  prerequisite_reasoning: 分类与比较

activity_suggestions:
